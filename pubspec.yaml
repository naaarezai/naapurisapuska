name: naapurisapuska
description: Naapuruston ruokahävikki-sovellus.
publish_to: 'none'
version: 1.0.12+13

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.0.0  # Tai uudempi
  shared_preferences: ^2.2.2 # Tarvitaan tallennukseen
  url_launcher: ^6.2.4  # LISÄÄ TÄMÄ


  # Firebase (tietokanta ja todennus)
  # Firebase - Compatible Set
  firebase_core: ^3.10.1
  cloud_firestore: ^5.6.1
  firebase_auth: ^5.4.1
  firebase_storage: ^12.4.1
  firebase_messaging: ^15.2.1
  firebase_crashlytics: ^4.2.1
  firebase_analytics: ^11.4.1
  
  # Kartat ja sijainti
  geolocator: ^13.0.1
  dart_geohash: ^2.1.0

  # Kamera ja kuvat
  image_picker: ^1.0.7

  # Apukirjastot
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  
  # Kuvan optimointi ja välimuisti
  image: ^4.1.7
  cached_network_image: ^3.3.1
  
  # HTTP-kutsuille (tekoäly-API)
  http: ^1.1.0
  
  # Ympäristömuuttujat (.env-tiedosto)
  flutter_dotenv: ^6.0.0
  
  # ML Kit - ilmainen offline-kuvan tunnistus
  google_mlkit_image_labeling: ^0.14.1
  flutter_local_notifications: ^19.5.0


  # UI Parannukset
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  share_plus: ^12.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_native_splash: ^2.3.1
  

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  generate: true  # Enable localization code generation
  
  # Assets (kuvat, fontit, jne.)
  assets:
    - assets/logo.png
    - assets/icon.png
    - assets/onboarding_1.png
    - assets/onboarding_2.png
    - assets/onboarding_3.png

# KORJATTU KOHTA: Tämä on nyt omassa lohkossaan vasemmassa reunassa
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#388E3C"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#4CAF50"
    theme_color: "#4CAF50"

flutter_native_splash:
  color: "#4CAF50"
  image: "assets/logo.png"
  color_dark: "#4CAF50"
  android: true
  ios: true
  web: true